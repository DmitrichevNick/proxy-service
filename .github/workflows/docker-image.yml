name: Dotnet Unittests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Dotnet Unittests Docker image
      run: docker build --no-cache -f docker/Dockerfile.test --tag my-image-name:$(date +%s) --target=test .
